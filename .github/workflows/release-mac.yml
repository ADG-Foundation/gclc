name: Build macOS DMG for Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
      fail-fast: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt6 and CMake
        run: brew install qt@6 cmake

      - name: Build macOS DMG
        run: make -C package mac VERSION=${{ github.ref_name }}

      - name: Upload DMG to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber