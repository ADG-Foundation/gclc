name: Build macOS Intel Package for Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos-x86_64:
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install cmake qt@6 ninja

      - name: Build macOS Artifacts
        run: |
          make -C packaging macos VERSION=${{ github.ref_name || 'dev' }}

      - name: Verify generated packages
        run: |
          ls -lh dist/

      - name: Upload to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip --clobber