name: Build macOS Intel Package for Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos-x86_64:
    runs-on: macos-14 # Fast Apple Silicon runner with prebuilt bottles
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          brew install cmake ninja
          pip install aqtinstall

      - name: Install Pre-built Intel Qt 6
        run: |
          python -m aqt install-qt mac desktop 6.6.3 clang_64 \
            --outputdir "${{ runner.temp }}/Qt"

      - name: Build macOS Intel Artifacts
        env:
          QT_DIR: ${{ runner.temp }}/Qt/6.6.3/macos
        run: |
          make -C packaging macos VERSION=${{ github.ref_name || 'dev' }}

      - name: Verify generated packages
        run: |
          ls -lh dist/
          # Optional: Verify architecture is x86_64
          file dist/* || true

      - name: Upload to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip --clobber